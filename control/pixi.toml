[workspace]
name = "safety-vla-control"
description = "CTL: ROS 2 Humble 제어 어댑터와 MuJoCo 시뮬레이션 환경"
channels = ["robostack-humble", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
ros-humble-ros-base = "*"
colcon-common-extensions = "*"
setuptools = "<80"
mujoco = "==3.15.0"
numpy = "*"
pillow = "*"
pytest = "<8"  # Humble의 launch_testing 플러그인이 pytest 8과 호환되지 않음

[target.osx-arm64.activation.env]
# macOS는 멀티캐스트 탐색이 막혀 같은 Mac 안의 노드끼리도 못 찾는 경우가 있어 로컬 통신으로 제한
ROS_LOCALHOST_ONLY = "1"

[tasks]
build = { cmd = "colcon build --symlink-install", cwd = "ros2_ws" }
test = { cmd = "pytest -q tests" }
# STEP 4: MuJoCo 바퀴 로봇 전진·회전·정지
sim = { cmd = "python mujoco/simulation.py" }
sim-view = { cmd = "mjpython mujoco/simulation.py --view" }
# STEP 5: ROS 2 /cmd_vel ↔ MuJoCo ↔ /odom
bridge = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge bridge'", depends-on = ["build"] }
# 뷰어 창과 카메라 3대 렌더가 같은 OpenGL 자원을 다퉈 둘 다 켜면 카메라가 약 5Hz로 떨어지므로 뷰어 모드는 카메라를 끈다
bridge-view = { cmd = "bash -c 'source ros2_ws/install/setup.bash && mjpython ros2_ws/install/mujoco_bridge/lib/mujoco_bridge/bridge --ros-args -p viewer:=true -p cameras:=false'", depends-on = ["build"] }
# CCTV를 Three.js로 렌더해 발행 (#55). cctv-threejs(렌더러)와 함께 실행
bridge-threejs = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge bridge --ros-args -p cctv_renderer:=threejs -p camera_hz:=15.0'", depends-on = ["build"] }
# 공장 장면(plant_scene.xml, 작업자 3명·설비)으로 띄운다. 카메라 위치가 scenario_scene.xml과 다르고, 장면이 무거워 10Hz로 둔다
bridge-threejs-plant = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge bridge --ros-args -p cctv_renderer:=threejs -p camera_hz:=10.0 -p model_path:=$PIXI_PROJECT_ROOT/mujoco/models/plant_scene.xml'", depends-on = ["build"] }
cctv-threejs = { cmd = "node render.mjs --ros", cwd = "scripts/threejs_cctv" }
# 카메라 토픽 → 웹 콘솔용 MJPEG (http://127.0.0.1:8081/stream/cctv_1). bridge와 함께 실행
cctv-stream = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge cctv_stream'", depends-on = ["build"] }
cmd-vel-demo = { cmd = "bash scripts/cmd_vel_demo.sh", depends-on = ["build"] }
# CT-01 성능 측정 (기본 60초, 카메라 15Hz, 640x480): pixi run measure -- 60 15 640 480
measure = { cmd = "bash scripts/measure_rates.sh", depends-on = ["build"] }
# CT-02 카메라 3대 스냅샷 (작업자가 금지구역 안에 있는 시점) → outputs/snapshots/
snapshot = { cmd = "python mujoco/scenario.py --snapshot outputs/snapshots" }
# MuJoCo ② 사전 시뮬레이션 서비스 POST /twin/simulate (http://127.0.0.1:8100)
twin-sim = { cmd = "python mujoco/twin_simulate.py" }
# Mock 어댑터·안전 경로
mock-adapter = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run robot_adapter mock_adapter'", depends-on = ["build"] }
tiago-adapter = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run robot_adapter tiago_adapter'", depends-on = ["build"] }
roundtrip = { cmd = "bash scripts/roundtrip.sh", depends-on = ["build"] }
# Panda 로봇 팔 집기·놓기 (모델은 저장소에 없으므로 처음 실행 시 내려받음)
fetch-models = { cmd = "bash scripts/fetch_models.sh" }
arm = { cmd = "python mujoco/manipulator.py", depends-on = ["fetch-models"] }
arm-view = { cmd = "mjpython mujoco/manipulator.py --view", depends-on = ["fetch-models"] }
# 로봇 팔 4대 (UR5e·UR10e·iiwa14·Panda, 이슈 #95)
arms-demo = { cmd = "python mujoco/arms.py --snapshot outputs/arms", depends-on = ["fetch-models"] }
bridge-arms = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge bridge --ros-args -p arms:=true'", depends-on = ["build", "fetch-models"] }
arm-adapters = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 launch robot_adapter arms.launch.py'", depends-on = ["build", "fetch-models"] }
arm-cycle-demo = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run robot_adapter arm_cycle_demo'", depends-on = ["build"] }
# 이동형 운반 로봇(AMR) 2대
amr-demo = { cmd = "python mujoco/amr.py --snapshot outputs/amr", depends-on = ["fetch-models"] }
bridge-plant = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run mujoco_bridge bridge --ros-args -p arms:=true -p amrs:=true'", depends-on = ["build", "fetch-models"] }
amr-adapters = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 launch robot_adapter amrs.launch.py'", depends-on = ["build"] }
amr-cycle-demo = { cmd = "bash -c 'source ros2_ws/install/setup.bash && ros2 run robot_adapter amr_cycle_demo'", depends-on = ["build"] }
